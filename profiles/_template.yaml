# One libcamera camera. Use "sequential" with [rgb, ir] if concurrent routes
# are unavailable; this is an explicit policy, never a fallback after failure.
auth:
  required_sensors: [rgb]
cameras:
  rgb: /base/soc@0/.../camera@36
capture:
  mode: sequential
match:
  rgb_detector_min_score: 0.6
  ir_detector_min_score: 0.45
attention:
  enabled: false  # requires rgb; tune using diagnose.py --json before enabling PAM
models:
  dir: /usr/share/facelock/models
store:
  dir: /var/lib/facelock
pam:
  user: ''
