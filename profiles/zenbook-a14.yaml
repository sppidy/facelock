# ASUS Zenbook A14: both cameras must match.
# Explicit dual-camera policy. Select zenbook-a14-ir.yaml for IR-only use.
auth:
  required_sensors: [rgb, ir]
cameras:
  rgb: /base/soc@0/cci@ac16000/i2c-bus@1/camera@36
  ir: /base/soc@0/cci@ac15000/i2c-bus@0/camera@24
capture:
  mode: dual-pycamera
  warmup_sec: 1.0
  timeout_sec: 15
dual:
  # CPU SoftISP crops to this size. Keep the full view, resize in acquisition.
  rgb_width: 1920
  rgb_height: 1080
  buffers: 4
  settle:
    stable: 4
    exp_tol: 0.10
    gain_tol: 0.05
    min_frames: 20
    max_frames: 90
ir_led:
  mode: flash
  path: /sys/class/leds/ir:flash/brightness
  strobe_path: /sys/class/leds/ir:flash/flash_strobe
  brightness: 128  # used only in explicit torch mode
challenge:
  phases: 8
  guard_ms: 100
  discard_frames: 2
  samples_per_phase: 2
  min_gap: 8.0
match:
  rgb_threshold: 0.38
  ir_threshold: 0.30
  detector_min_score: 0.6
quality:
  min_blur: 25.0
  brightness_range: [15.0, 235.0]
  min_face_frac: 0.05
models:
  dir: /usr/share/facelock/models
store:
  dir: /var/lib/facelock
pam:
  user: ''  # set to your account; empty allows any explicitly enrolled account
  verify_timeout_sec: 20
runtime:
  # Empty uses system libcamera. For a patched build use a root-owned snapshot.
  # Its .so libraries and matching Python binding must have the same ABI.
  stack: ''
  tuning: /usr/share/facelock/tuning
