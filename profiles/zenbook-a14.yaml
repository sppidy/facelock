# ASUS Zenbook A14 (UX3407, Snapdragon X1 Plus) — reference platform.
# OV02C10 RGB + HM1092 mono IR behind one ISP; concurrent dual needs the
# patched kernel mapping + disjoint-routes libcamera (see research/).
name: "zenbook-a14"
machine: "ASUS Zenbook A14 UX3407 (Snapdragon X1 Plus)"
note: "dual-pycamera works with candidate kernel + staged libcamera; stock stack falls back to sequential"

cameras:
  rgb: "/base/soc@0/cci@ac16000/i2c-bus@1/camera@36"
  ir: "/base/soc@0/cci@ac15000/i2c-bus@0/camera@24"

ir_sensor:
  width: 560
  height: 360
  stride: 704
  packing: "r10-csi2p"

ir_led:
  path: "/sys/class/leds/ir:flash/brightness"
  strobe_path: "/sys/class/leds/ir:flash/flash_strobe"
  brightness: 128

capture:
  mode: "dual-pycamera"
  rgb_width: 640
  rgb_height: 480
  buffers: 16
  width: 640
  height: 480
  warmup_sec: 1.5
  timeout_sec: 30

match:
  rgb_threshold: 0.38
  ir_threshold: 0.30
  detector_min_score: 0.6

# --- standard sections (same meaning as config.yaml) ---
ir_capture:
  frames: 10
  black_mean_min: 2.0
models:
  dir: "/usr/share/facelock/models"
fusion:
  mode: "both"
dual:
  rgb_width: 640
  rgb_height: 480
  buffers: 16
store:
  dir: "/var/lib/facelock"
pam:
  user: "spidy"
  verify_timeout_sec: 25
