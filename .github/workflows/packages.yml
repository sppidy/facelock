name: packages

on:
  push:
    branches: ['**']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      stable: ${{ steps.prepare.outputs.stable }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python3 -m pip install numpy opencv-python-headless PyYAML
          sudo apt-get update -qq
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 xvfb
      - name: Offline tests
        run: xvfb-run -a python3 -B -m unittest discover -s tests -v
      - name: Classify and archive exact checkout
        id: prepare
        run: python3 ci/prepare.py
      - name: Build embedded runtime and package on Arch Linux ARM
        run: |
          bash ci/arch-rootfs.sh
          docker run --rm -v "$PWD:/checkout:ro" -v "$PWD/dist:/out" \
            facelock-arch-builder bash /checkout/ci/build-arch.sh
      - name: Build Debian package and inspect both native packages
        run: |
          docker pull debian:trixie
          docker image inspect debian:trixie --format '{{index .RepoDigests 0}}' > dist/builder-image.txt
          docker run --rm -v "$PWD:/checkout:ro" -v "$PWD/dist:/out" \
            debian:trixie bash /checkout/ci/build.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: publish-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: packages-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Publish draft, verify remote bytes, then expose release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_STABLE: ${{ needs.build.outputs.stable }}
        run: python3 ci/publish.py
      - name: Assemble pacman repo site
        run: python3 ci/repo_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
