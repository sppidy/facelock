name: packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    name: Arch (aarch64, makepkg)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build pacman package in Arch Linux ARM container
        run: |
          docker run --rm \
            -v "$PWD:/pkg" -w /pkg \
            menci/archlinuxarm:base-devel \
            bash -c "
              set -e
              pacman -Sy --noconfirm --needed git 2>&1 | tail -1
              id builder >/dev/null 2>&1 || useradd -m builder
              chown -R builder:builder /pkg
              su builder -c 'cd /pkg && makepkg -s --noconfirm --clean'
            "
      - name: Collect artifact
        run: ls -l ./*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch-aarch64
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  debian:
    name: Debian (arm64, dpkg)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper
      - name: Build .deb
        run: dpkg-buildpackage -b -us -uc
      - name: Collect artifact
        run: ls -l ../*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-arm64
          path: "../*.deb"
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: [arch, debian]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
