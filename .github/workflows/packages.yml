name: packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classify:
    name: Release or nightly?
    runs-on: ubuntu-24.04
    if: github.ref_type == 'branch' || github.event_name != 'push'
    outputs:
      pkg: ${{ steps.filter.outputs.pkg }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pkg:
              - 'PKGBUILD'
              - '.SRCINFO'
              - 'facelock.install'
              - 'debian/**'

  arch:
    name: Arch (aarch64, makepkg)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build pacman package in Arch Linux ARM container
        run: |
          docker run --rm \
            -v "$PWD:/pkg" -w /pkg \
            menci/archlinuxarm:base-devel \
            bash -c "
              set -eo pipefail
              pacman-key --init
              pacman-key --populate archlinuxarm
              # unprivileged CI containers cannot apply pacman's Landlock sandbox
              # (must sit in [options], not appended at EOF inside a repo block)
              grep -q '^DisableSandbox' /etc/pacman.conf || \
                sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
              pacman -Sy --noconfirm --needed git python python-opencv python-numpy python-yaml gstreamer gst-plugins-base v4l-utils libcamera pam
              id builder >/dev/null 2>&1 || useradd -m builder
              chown -R builder:builder /pkg
              su builder -c 'cd /pkg && makepkg --noconfirm --clean'
            "
      - name: Collect artifact
        run: ls -l ./*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: arch-aarch64
          path: "*.pkg.tar.zst"
          if-no-files-found: error

  debian:
    name: Debian (arm64, dpkg)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential fakeroot debhelper
      - name: Build .deb
        run: dpkg-buildpackage -b -us -uc
      - name: Collect artifact
        run: mv ../*.deb ./ && ls -l ./*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: debian-arm64
          path: "*.deb"
          if-no-files-found: error

  nightly:
    name: Nightly prerelease
    needs: [classify, arch, debian]
    if: >-
      github.ref_type != 'tag' &&
      (github.event_name != 'push' || needs.classify.outputs.pkg != 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly packages
          prerelease: true
          files: dist/*

  release-pkg:
    name: Packaging-change release
    needs: [classify, arch, debian]
    if: >-
      github.ref_type == 'branch' &&
      github.event_name == 'push' &&
      needs.classify.outputs.pkg == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Date tag
        id: tag
        run: echo "tag=pkg-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Packaging ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: dist/*

  release-tag:
    name: Tag release
    needs: [arch, debian]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
